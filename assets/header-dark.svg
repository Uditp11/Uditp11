<svg xmlns="http://www.w3.org/2000/svg" width="840" height="240" viewBox="0 0 840 240" role="img" aria-labelledby="t d">
<title id="t">Udit Parihar</title>
<desc id="d">I build machine learning models I can measure, and the APIs, web apps and tests around them. Frankfurt am Main. M.Sc. Global Software Development, Hochschule Fulda. Open to roles in ML and AI engineering, Java and Python backend, full-stack, QA and test automation, data and automation.</desc>
<style>
.name { font: 700 40px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #f0f6fc; }
.pitch { font: 400 18px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #f0f6fc; }
.meta { font: 400 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #9198a1; }
.cap { font: 600 11px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #9198a1; letter-spacing: 1.5px; }
.lane, .lane-static { font: 700 20px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #ab7df8; }
.lane { opacity: 0; animation: show 13.0s infinite; }
.lane-static { opacity: 0; font-size: 15px; }
@keyframes show { 0% { opacity: 0; transform: translateY(6px); } 4% { opacity: 1; transform: none; } 17% { opacity: 1; } 20% { opacity: 0; } 100% { opacity: 0; } }
.net line { stroke: #3d444d; stroke-width: 1.5; }
.net circle { fill: #ab7df8; }
.wire { stroke: #3d444d; stroke-width: 2; stroke-dasharray: 4 5; fill: none; }
.box { fill: #151b23; stroke: #3d444d; stroke-width: 1.5; }
.brace { font: 700 22px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #f0f6fc; }
.ok { fill: #3fb950; }
.tick { stroke: #ffffff; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.lbl { font: 400 11px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #9198a1; }
.pulse { fill: #ab7df8; offset-path: path("M646 108 L780 108"); animation: run 3.2s ease-in-out infinite; }
@keyframes run { 0% { offset-distance: 0%; opacity: 0; } 10% { opacity: 1; } 85% { opacity: 1; } 100% { offset-distance: 100%; opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .anim { animation: none !important; } .lane { opacity: 0 !important; } .lane-static { opacity: 1 !important; } }
</style>
