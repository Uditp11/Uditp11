<svg xmlns="http://www.w3.org/2000/svg" width="840" height="110" viewBox="0 0 840 110" role="img" aria-label="A small planet with a football orbiting it">
<style>
.planet { fill: #8250df; }
.ring { fill: none; stroke: #59636e; stroke-width: 1.5; }
.ball { fill: #f6f8fa; stroke: #1f2328; stroke-width: 1.2; offset-path: path("M360 55 A60 18 -12 1 0 480 55 A60 18 -12 1 0 360 55"); animation: orbit 9s linear infinite; }
.patch { fill: #1f2328; }
.star { fill: #59636e; animation: tw 4s ease-in-out infinite; }
@keyframes orbit { to { offset-distance: 100%; } }
@keyframes tw { 0%,100% { opacity: .25; } 50% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .anim { animation: none !important; } .lane { opacity: 0 !important; } .lane-static { opacity: 1 !important; } }
</style>
<circle class="star anim" cx="120" cy="30" r="1.4" style="animation-delay:0s"/><circle class="star anim" cx="170" cy="78" r="1.4" style="animation-delay:1.1s"/><circle class="star anim" cx="250" cy="22" r="1.4" style="animation-delay:2.3s"/><circle class="star anim" cx="560" cy="26" r="1.4" style="animation-delay:0.6s"/><circle class="star anim" cx="640" cy="70" r="1.4" style="animation-delay:1.8s"/><circle class="star anim" cx="720" cy="34" r="1.4" style="animation-delay:2.9s"/><circle class="star anim" cx="330" cy="86" r="1.4" style="animation-delay:1.4s"/><circle class="star anim" cx="500" cy="88" r="1.4" style="animation-delay:0.3s"/>
<ellipse class="ring" cx="420" cy="55" rx="60" ry="18" transform="rotate(-12 420 55)"/>
<circle class="planet" cx="420" cy="55" r="20"/>
<g class="ball anim"><circle r="7"/><path class="patch" d="M0 -3 L2.9 -0.9 L1.8 2.4 L-1.8 2.4 L-2.9 -0.9 Z"/></g>
</svg>
